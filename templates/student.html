{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="header">
    KKPP School Management Portal
</div>

<div class="card center">

    <h2>Student Login</h2>

<form method="POST" action="{% url 'student_login' %}">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username">

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password">

    <br><br>

    <button type="submit">
        Login
    </button>
</form>

    <br><br>

    <p>
    Don't have an account?
    <a href="{% url 'student_signup' %}">Sign Up</a>
    </p>

    </div>

    <script src="{% static 'js/script.js' %}"></script>

    <div class="footer">
        © 2026 KKPP School Management Portal
    </div>

</body>
</html>
